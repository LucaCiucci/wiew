[package]
name = "wiew"
version = "0.1.0"
edition = "2024"

[features]
default = ["egui"]
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
anyhow = "1"
bytemuck = { version = "^1.24", features = ["derive"] }
cgmath = "0.18"
egui = { version = "0.34", optional = true, default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.34", optional = true }
rotation3.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror = "2"
type-map = "^0.5"
#wgpu = { version = "29", features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = { version = "29" }

[[example]]
name = "egui"
required-features = ["egui"]

[dev-dependencies]
eframe = { version = "0.34", features = ["wgpu"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
ply-rs = "0.1.3"
pollster = "0.4.0"
