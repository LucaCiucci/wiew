[package]
name = "wiew"
version = "0.1.0"
edition = "2024"

[features]
default = ["egui"]
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
anyhow = "1.0.103"
bytemuck = { version = "1.24.0", features = ["derive"] }
cgmath = "0.18"
egui = { version = "0.34", optional = true, default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.34", optional = true }
rotation3.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
type-map = "0.5.1"
wgpu = { version = "29.0.3", features = ["fragile-send-sync-non-atomic-wasm"] }

[[example]]
name = "egui"
required-features = ["egui"]

[dev-dependencies]
eframe = { version = "0.34", features = ["wgpu"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
ply-rs = "0.1.3"
pollster = "0.4.0"
