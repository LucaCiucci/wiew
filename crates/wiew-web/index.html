<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>wiew — point cloud viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #1a1a1a;
            overflow: hidden;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="wiew_canvas"></canvas>
    <div class="centered" id="loading_text">Loading…</div>
    <link data-trunk rel="rust" href="Cargo.toml" />
</body>
</html>
